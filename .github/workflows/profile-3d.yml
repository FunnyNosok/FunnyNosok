name: GitHub-Profile-3D-Contrib

on:
  # Запуск каждый день в полночь по UTC
  schedule:
    - cron: "0 0 * * *"
  # Позволяет запустить экшен вручную в любое время
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-mono.json
      - name: Commit & Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update 3d contribution graph"
          git push
